# Env conda "vllm-base": vLLM per gli esperimenti offline (classe LLM), fuori da Cerberus.
# Stessa versione dell'immagine dei server (vllm/vllm-openai:v0.32.0). Non si tocca:
# ogni esperimento è un venv sopra questo env, creato con scripts/new-exp.sh.
#
# Qui c'è solo Python: vllm si installa dopo con pip (envs/vllm-base-requirements.txt),
# con i file temporanei sul disco locale del nodo. Estrarre ~15 GB di wheel su
# Lustre dentro `conda env create` è fallito con "OSError: [Errno 14] Bad address".
# Il modo più semplice: sbatch envs/setup_vllm_base.sbatch
#
# Guida: docs/esperimenti_offline.md
name: vllm-base
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
