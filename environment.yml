# Cerberus — ambiente conda "cerberus".
#   conda env create -f environment.yml
#   conda activate cerberus
#   pip install -e .          # installa il comando `cerberus` e le dipendenze (da pyproject.toml)
name: cerberus
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git                    # sul login HPC UniNA git non c'è
