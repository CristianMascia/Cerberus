# Benchmark su IBiSCo (V100 32 GB): lo stesso GGUF e gli stessi slot del modello
# llama.cpp di unina.conf, per misurare lo speedup dovuto all'hardware.
# Guida: ../../docs/benchmark.md

[allocation]
gpus_per_node = 3

[defaults]
reasoning     = "off"

[[model]]
label             = "qwen3-8b-llamacpp"
hf_repo           = "Qwen/Qwen3-8B-GGUF"
gguf_file         = "Qwen3-8B-Q8_0.gguf"
alloc_mode        = "MANUAL"
num_gpus          = 1
parallel          = 32
max_input_tokens  = 2048
max_output_tokens = 512
