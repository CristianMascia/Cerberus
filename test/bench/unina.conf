# Benchmark sull'HPC UniNA: lo stesso Qwen3-8B sui due backend, nello stesso nodo
# (vLLM su una H100, llama.cpp sull'altra). Si misura un modello alla volta con
# scripts/bench.py.

[allocation]
gpus_per_node = 2
vram_gib      = 92

[defaults]
reasoning     = "off"

# llama.cpp: GGUF Q8_0, 32 slot (oltre 32 richieste in contemporanea si accodano).
[[model]]
label             = "qwen3-8b-llamacpp"
hf_repo           = "Qwen/Qwen3-8B-GGUF"
gguf_file         = "Qwen3-8B-Q8_0.gguf"
alloc_mode        = "AUTO"
parallel          = 32
max_input_tokens  = 2048
max_output_tokens = 512

# vLLM: safetensors bf16, fino a 128 sequenze in contemporanea.
[[model]]
label             = "qwen3-8b-vllm"
backend           = "vllm"
hf_repo           = "Qwen/Qwen3-8B"
alloc_mode        = "AUTO"
parallel          = 128
max_input_tokens  = 2048
max_output_tokens = 512
