# Cerberus demo (HPC UniNA, 1 nodo con 2x H100 NVL): i due backend insieme.
# Qwen3-8B servito da vLLM occupa una H100 intera (vLLM la prealloca); il modello
# GGUF piccolo va su llama.cpp nell'altra. See ../../../docs/hpc_unina_h100.md

[allocation]
gpus_per_node = 2
vram_gib      = 92

[defaults]
parallel      = 1          # slot di llama.cpp; per vLLM vale `parallel` del modello (default 64)
kv_cache_type = "f16"
reasoning     = "auto"

[batch]
partition     = "ingnormal"
time          = "04:00:00"
cpus_per_task = 10

# vLLM: safetensors da HF (~16 GiB in bf16). parallel = sequenze in contemporanea
# (--max-num-seqs); max_input + max_output = lunghezza di UNA sequenza (--max-model-len).
[[model]]
label             = "qwen3-8b"
backend           = "vllm"
hf_repo           = "Qwen/Qwen3-8B"
alloc_mode        = "AUTO"
parallel          = 64
max_input_tokens  = 12288
max_output_tokens = 4096
reasoning_parser  = "qwen3"

# llama.cpp, come nelle altre demo.
[[model]]
label             = "qwen-coder"
hf_repo           = "ggml-org/Qwen2.5-Coder-0.5B-Q8_0-GGUF"
gguf_file         = "qwen2.5-coder-0.5b-q8_0.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 4096
max_output_tokens = 256
