# Cerberus (HPC UniNA, 1 nodo 2x H100): Qwen3-8B su vLLM con 2 repliche, una per GPU.
# Il client alterna le richieste tra le due copie. See ../../../docs/hpc_unina_h100.md

[allocation]
gpus_per_node = 2
vram_gib      = 92

[[model]]
label             = "qwen3-8b"
backend           = "vllm"
hf_repo           = "Qwen/Qwen3-8B"
alloc_mode        = "AUTO"
replicas          = 2
parallel          = 64
max_input_tokens  = 12288
max_output_tokens = 4096
reasoning_parser  = "qwen3"
