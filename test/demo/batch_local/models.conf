# Cerberus — demo locale della batch API.
#
# Un solo modello piccolo (Qwen2.5-Coder-0.5B), servito da run_demo.sh con un
# llama-server locale via Singularity. La sezione [batch] dà i default di
# `cerberus batch submit` (sovrascrivibili con --shards / --repeats).

[allocation]
gpus_per_node = 1

[batch]
shards  = 2
repeats = 2
time    = "00:10:00"

[[model]]
label             = "qwen-coder"
hf_repo           = "ggml-org/Qwen2.5-Coder-0.5B-Q8_0-GGUF"
gguf_file         = "qwen2.5-coder-0.5b-q8_0.gguf"
alloc_mode        = "MANUAL"
num_gpus          = 1
max_input_tokens  = 1024
max_output_tokens = 256
parallel          = 2
reasoning         = "off"
