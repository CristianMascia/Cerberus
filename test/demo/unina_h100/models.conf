# Cerberus demo (HPC UniNA, partizione ingnormal, 1 nodo con 2x H100 NVL).
# Stessi modelli della demo IBiSCo: su V100 da 32 GB il 70B va diviso su 2 GPU,
# qui sta su una sola H100. See ../../../docs/hpc_unina_h100.md

[allocation]
gpus_per_node = 2
vram_gib      = 92         # H100 NVL: 95830 MiB = 93.6 GiB, meno un margine per il driver

[defaults]
parallel      = 1
kv_cache_type = "f16"
reasoning     = "auto"

[batch]
partition     = "ingnormal"
time          = "04:00:00"
cpus_per_task = 32

# Llama-3.3-70B Q4_K_M (~40 GiB): una sola H100. Con 4 slot da 16k token il
# KV-cache sale a ~20 GiB e ci sta ancora.
[[model]]
label             = "llama33-70b"
hf_repo           = "lmstudio-community/Llama-3.3-70B-Instruct-GGUF"
gguf_file         = "Llama-3.3-70B-Instruct-Q4_K_M.gguf"
alloc_mode        = "AUTO"
parallel          = 4
max_input_tokens  = 12288
max_output_tokens = 4096

# Un modello piccolo, impacchettato accanto al 70B.
[[model]]
label             = "qwen-coder"
hf_repo           = "ggml-org/Qwen2.5-Coder-0.5B-Q8_0-GGUF"
gguf_file         = "qwen2.5-coder-0.5b-q8_0.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 4096
max_output_tokens = 256
